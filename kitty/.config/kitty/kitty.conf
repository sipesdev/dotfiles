# Kitty — matte black
# Palette source for the Doom theme (doom/.config/doom/themes/matte-black-theme.el);
# keep the two in step.

# Ctrl+Backspace -> Ctrl+W (word-delete) in every app and mode. send_text writes
# the bytes straight to the program, ahead of any keyboard-protocol encoding, so
# this also works inside herdr, whose client enables the Kitty keyboard protocol
# and would otherwise deliver a bare ^H that Claude Code treats as a
# single-character backspace.
map ctrl+backspace send_text all \x17

# Shift+Return -> ESC CR, carried over unchanged from the Alacritty config.
map shift+enter send_text all \x1b\r

font_family JetBrainsMono Nerd Font
font_size 11.0

# No padding and a centred cell grid are Kitty's defaults (window_padding_width 0,
# placement_strategy center): full-screen TUIs (Emacs, herdr) paint to the window
# edge, and the leftover cell fraction is spread evenly instead of piling up
# right/bottom.
background_opacity 0.96

# Closing a window never asks, even with a program running (Alacritty never
# did), and no audio bell.
confirm_os_window_close 0
enable_audio_bell no

foreground #bebebe
background #121212
cursor #eaeaea
cursor_text_color #121212
selection_foreground #bebebe
selection_background #515151

# normal
color0 #333333
color1 #D35F5F
color2 #FFC107
color3 #e68e0d
color4 #5e81ac
color5 #b48ead
color6 #bebebe
color7 #bebebe

# bright
color8  #8a8a8d
color9  #b91c1c
color10 #f59e0b
color11 #FFC107
color12 #7aa2f7
color13 #c678dd
color14 #eaeaea
color15 #ffffff
