# Shared DXVK config for all Proton/Wine games, activated by DXVK_CONFIG_FILE
# (set in uwsm/env + hypr envs.lua). Per-game override: set DXVK_CONFIG in that
# game's Steam launch options; it is applied on top of this file.
#
# Cache dynamic D3D11 resources in system memory instead of mapping GPU memory
# directly. On the OCuLink eGPU (RTX 3080 Ti, PCIe 4.0 x4) every mapped write
# crosses the link and CPU reads of write-combined GPU memory are extremely
# slow; caching keeps those accesses in RAM. v/i/c = vertex, index, constant
# buffers ('a' would add shader resources - benchmark before going wider).
d3d11.cachedDynamicResources = vic
