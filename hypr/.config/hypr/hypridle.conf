# hypridle — idle management (hyprlang)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'   # wake displays on resume
}

# 2.5 min → dim the backlight (restored on activity)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 10 min → lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 20 min → turn the screens off (10 min after lock). A lit hyprlock renders every
# lit display continuously on the eGPU (hyprwm/hyprlock#810, closed as not
# planned upstream) — dpms-off is what lets the card idle while locked.
# NOTE: this build's `hyprctl dispatch` evaluates Lua, not hyprlang — plain
# `dpms off` fails to parse, which silently kept the screens on forever.
# GATED by egpu-dpms-guard, which skips the off only while docked with eDP-1
# still enabled -- the wedge-prone case, where a dpms cycle permanently blanks
# the panel (aquamarine#324 — secondary-renderer teardown breaks the cross-GPU
# blit; fix merged in aquamarine#316 but unreleased as of 0.14.0). In a normal
# docked session monitors.lua has the panel disabled, so the off goes through
# and the externals do turn off while locked. Restore the direct hyprctl
# dpms-off here and retire the guard once a fixed release ships.
listener {
    timeout    = 1200
    on-timeout = $HOME/.local/bin/egpu-dpms-guard
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
