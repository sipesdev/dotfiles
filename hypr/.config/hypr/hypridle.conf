# hypridle — idle management (hyprlang)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms("on")'   # wake displays on resume
}

# 2.5 min → dim the backlight (restored on activity)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min → lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min → turn the screens off (30s after lock). A lit hyprlock renders all
# three displays continuously on the eGPU (hyprwm/hyprlock#810, closed as not
# planned upstream) — dpms-off is what lets the card idle while locked.
# NOTE: this build's `hyprctl dispatch` evaluates Lua, not hyprlang — plain
# `dpms off` fails to parse, which silently kept the screens on forever.
# GATED while the eGPU is docked: a dpms cycle then permanently blanks eDP-1
# (aquamarine#324 — secondary-renderer teardown breaks the cross-GPU blit;
# fix merged in aquamarine#316 but unreleased as of 0.14.0), so the guard
# skips the off and the screens stay lit while locked. Restore the direct
# hyprctl dpms-off here and retire the guard once a fixed release ships.
listener {
    timeout    = 330
    on-timeout = $HOME/.local/bin/egpu-dpms-guard
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 10 min → suspend (skipped while the OCuLink eGPU is docked — it can't survive
# s2idle; the guard suspends only when undocked. See egpu-suspend-guard.)
listener {
    timeout    = 600
    on-timeout = $HOME/.local/bin/egpu-suspend-guard
}
