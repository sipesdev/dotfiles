# hypridle — idle management (hyprlang)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on     # wake displays on resume
}

# 2.5 min → dim the backlight (restored on activity)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min → lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 6 min → turn the screen off
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 10 min → suspend
listener {
    timeout    = 600
    on-timeout = systemctl suspend
}
