# hyprlock — lock screen (hyprlang), matte black
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$accent  = rgb(e68e0d)
$bg      = rgb(121212)
$surface = rgb(333333)
$text    = rgb(bebebe)
$dim     = rgb(8a8a8d)
$danger  = rgb(b91c1c)
$font    = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true
}

background {
    monitor     =
    path        = ~/.config/hypr/wallpapers/1-dark-waters.jpg
    blur_passes = 3
    blur_size   = 6
    brightness  = 0.7
    color       = $bg
}

# Time
label {
    monitor   =
    text      = cmd[update:10000] echo "$(date +'%-I:%M %p')"
    color     = $text
    font_size = 96
    font_family = $font
    position  = 0, 220
    halign    = center
    valign    = center
}

# Date
label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color     = $dim
    font_size = 20
    font_family = $font
    position  = 0, 130
    halign    = center
    valign    = center
}

# Password input
input-field {
    monitor          =
    size             = 320, 56
    outline_thickness = 2
    dots_size        = 0.2
    dots_spacing     = 0.3
    dots_center      = true
    rounding         = 14
    outer_color      = $accent
    inner_color      = $surface
    font_color       = $text
    check_color      = $accent
    fail_color       = $danger
    fade_on_empty    = false
    placeholder_text = <span foreground="##8a8a8d">Enter password</span>
    position         = 0, -40
    halign           = center
    valign           = center
}

# User
label {
    monitor   =
    text      = $USER
    color     = $dim
    font_size = 16
    font_family = $font
    position  = 0, 40
    halign    = center
    valign    = bottom
}
