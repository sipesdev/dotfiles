# hyprpaper — wallpaper daemon (hyprlang)
# Absolute paths (no '~') + explicit monitor name (the empty-monitor ",path"
# wildcard didn't apply at startup on this version).
ipc = on
splash = false

preload = ~/.config/hypr/wallpapers/1-dark-waters.jpg
wallpaper = eDP-1,~/.config/hypr/wallpapers/1-dark-waters.jpg
