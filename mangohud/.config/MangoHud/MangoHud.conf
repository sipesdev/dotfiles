# MangoHud config - benchmark layout with logging
# Applied live via reload_cfg (Shift_L+F4); safe to trim down after the session.

control=mangohud

# GPU
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
vram
throttling_status

# CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_power
core_load
ram

# Frames
fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing

# Context
gamemode
wine
engine_version
vulkan_driver

# Logging (CSV per frame, auto-stops after log_duration seconds)
output_folder=/home/michael/.cache/mangohud-bench
log_duration=300
log_interval=0
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4
toggle_hud=Shift_R+F12
