; GameMode daemon config. Created 2026-08-15 after an A/B benchmark on Schedule I
; (5 min pinned vs unpinned, Ryzen AI 9 HX 370): core pinning to the four Zen 5
; cores left ~140 game threads fighting for 4 cores. Average fps tied, but
; unpinned won every pacing metric (1% low +16%, 0.1% low +130%, worst frame
; 368ms -> 36ms) because workers spill to the Zen 5c cores while amd-pstate
; preferred-core scheduling keeps the main thread on Zen 5 ~90% of the time.
; GameMode's default with no config is pin_cores=yes, so this file must exist.

[cpu]
park_cores=no
pin_cores=no
