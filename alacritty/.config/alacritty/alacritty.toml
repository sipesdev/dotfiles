# Alacritty — matte black
# (Shift+Return binding preserved exactly from your original.)

# Ctrl+Backspace -> Ctrl+W (word-delete) in every app and mode. Alacritty applies
# bindings before Kitty-protocol encoding, so this also works inside herdr,
# whose client enables the Kitty keyboard protocol and would otherwise deliver a
# bare ^H that Claude Code treats as a single-character backspace.
[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
# No padding: full-screen TUIs (Emacs, herdr) paint to the window edge instead of
# sitting inside a frame. dynamic_padding spreads the leftover cell fraction
# (tiled sizes are never a cell multiple) evenly instead of piling it up right/bottom.
padding = { x = 0, y = 0 }
dynamic_padding = true
opacity = 0.96

[colors.primary]
background = "#121212"
foreground = "#bebebe"

[colors.cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.selection]
background = "#515151"
text = "#bebebe"

[colors.normal]
black   = "#333333"
red     = "#D35F5F"
green   = "#FFC107"
yellow  = "#e68e0d"
blue    = "#5e81ac"
magenta = "#b48ead"
cyan    = "#bebebe"
white   = "#bebebe"

[colors.bright]
black   = "#8a8a8d"
red     = "#b91c1c"
green   = "#f59e0b"
yellow  = "#FFC107"
blue    = "#7aa2f7"
magenta = "#c678dd"
cyan    = "#eaeaea"
white   = "#ffffff"
