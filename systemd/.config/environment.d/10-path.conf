# PATH for the systemd user manager (environment.d(5)); read at login before
# uwsm starts the session, so every user unit (emacs.service) and every app the
# compositor spawns can find the helper scripts and the Doom CLI. The
# interactive shells (.zshrc/.bashrc) guard against re-adding these entries.
PATH=$HOME/.local/bin:$HOME/.config/emacs/bin:$PATH
