# PATH for the systemd user manager (environment.d(5)); read once when the
# manager starts at login, before uwsm. uwsm then exports the login shell's
# PATH over it (PATH is in its always-export set), so for the Wayland session
# the same prefix is applied again in uwsm/env; this file still covers units
# the manager starts before the session. The interactive shells
# (.zshrc/.bashrc) guard against re-adding these entries.
PATH=$HOME/.local/bin:$HOME/.config/emacs/bin:$PATH
